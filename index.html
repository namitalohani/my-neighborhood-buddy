<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mohalla Buddy – Mahanagar, Lucknow</title>

<meta name="description" content="Mohalla Buddy: neighbourhood information, map, news and civic help for Mahanagar, Lucknow."><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><style>
:root{--p:#EFE6D4;--c:#FBF6EA;--i:#231F1A;--r:#A8412D;--t:#0E5A5B;--g:#C79A2C;--m:#6d6354;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--p:#1b1613;--c:#271f1a;--i:#f1e8d6;--r:#d9694f;--t:#46b3ae;--m:#b3a58f}
*{box-sizing:border-box}html{font-size:17px}html.big{font-size:21px}
body{margin:0;background:var(--p);color:var(--i);font-family:Hind,'Noto Sans Devanagari',sans-serif;line-height:1.5;display:grid;grid-template-columns:230px 1fr;min-height:100vh}

aside{position:sticky;top:0;height:100vh;overflow:auto;border-right:2px solid var(--i);padding:16px 12px;background:var(--c)}
.logo{font-size:1.45rem;line-height:1.1;color:var(--r)}.logo small{display:block;font:500 .75rem Hind;color:var(--m);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
#nav button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;font-size:1rem}
#nav button i{font:700 .72rem monospace;color:var(--r);padding-top:5px;font-style:normal}#nav button.on{background:var(--i);color:var(--p)}#nav button.on i{color:var(--g)}
button,select,input,textarea{font:inherit;color:var(--i);background:var(--c);border:2px solid var(--i);border-radius:5px;padding:6px 11px}button{cursor:pointer}
button.pri{background:var(--r);color:#fff;border-color:var(--i);box-shadow:3px 3px 0 var(--i);font-weight:700}button.pri:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--i)}button.on{background:var(--t);color:#fff}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:2px solid var(--i);align-items:center}.top input{flex:1;min-width:150px}
main{padding:18px;max-width:1050px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:end;background:var(--c);border:2px solid var(--i);box-shadow:6px 6px 0 var(--t);border-radius:6px;padding:26px;background-image:radial-gradient(var(--g) 1.4px,transparent 1.6px);background-size:18px 18px;background-color:var(--c)}
.hero h1{font-size:2.5rem;line-height:1.1;margin:0;background:var(--c);display:inline;padding:0 6px;box-decoration-break:clone}.hero p{background:var(--c);display:inline-block;padding:4px 6px;margin:10px 0 0}
.door{border:2px solid var(--i);border-radius:999px 999px 4px 4px;background:var(--t);color:#fff;padding:60px 18px 18px;text-align:center;font-family:'Yatra One',serif;font-size:1.3rem;min-height:210px;box-shadow:4px 4px 0 var(--i)}
h2{font-size:1.55rem;margin:28px 0 10px;display:flex;gap:10px;align-items:center}h2::after{content:"";flex:1;border-top:2px dashed var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.g2{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.cd{background:var(--c);border:2px solid var(--i);box-shadow:5px 5px 0 var(--r);border-radius:6px;padding:14px}.cd h3{margin:8px 0 3px;font-size:1.15rem}.cd p{margin:4px 0;color:var(--m)}
.arch{border-radius:70px 70px 6px 6px;text-align:center;padding:26px 8px 12px;cursor:pointer;box-shadow:4px 4px 0 var(--t);font-weight:700}.arch i{font-size:2rem;display:block;font-style:normal}.arch:hover{background:var(--g);color:#231F1A}
.b{display:inline-block;font:700 .64rem monospace;text-transform:uppercase;border:1.5px solid currentColor;padding:1px 6px;margin-right:4px;transform:rotate(-2deg)}.b.ok{color:var(--t)}.b.w{color:var(--r)}.b.d{background:var(--i);color:var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{padding:2px 10px}
label{display:block;font-weight:700;margin:9px 0 2px}input,select,textarea{width:100%}
.warn{border:2px solid var(--r);border-left-width:10px;padding:10px 12px;margin:10px 0;background:var(--c)}
.tl{border-left:3px solid var(--t);padding-left:12px;margin:8px 0}a{color:var(--t);font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row a button{font-weight:700}
.sg{cursor:pointer}.sg:hover path,.sg:focus path{stroke:var(--r);stroke-width:5}footer{grid-column:1/3;border-top:2px solid var(--i);padding:16px 20px;color:var(--m);font-size:.85rem}
@media(max-width:800px){body{display:block}aside{position:static;height:auto;border-right:0;border-bottom:2px solid var(--i)}#nav{display:flex;overflow-x:auto;gap:2px}#nav button{width:auto;white-space:nowrap}.hero{grid-template-columns:1fr}.hero h1{font-size:1.8rem}.door{display:none}}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #231F1A;box-shadow:2px 2px 0 #0006}.pin span{transform:rotate(45deg);font-size:15px}.pp h3{margin:0 0 4px;font:1.1rem 'Yatra One',serif}.pp .b{color:#A8412D}.pp div{margin-top:4px}.leaflet-container{font-family:Hind,sans-serif}</style></head><body>
<aside><div class="logo">मोहल्ला<br>Buddy<small>Mahanagar · Lucknow</small></div><nav id="nav" style="margin-top:14px"></nav></aside>
<div><div class="top"><input id="q" aria-label="Search"><button id="go" class="pri">🔍</button><select id="loc" style="width:auto" aria-label="Locality"></select><button id="lg" aria-label="Language">हिं/EN</button><button id="th" aria-label="Theme">🌓</button><button id="bg" aria-label="Large text">A+</button></div><main id="app"></main></div>
<footer>Independent community project — not operated by Lucknow Municipal Corporation or any government body, party or campaign. Links and numbers come from public sources: confirm on the official site before relying on them. “SAMPLE” entries are invented for demonstration.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TR={media:['News & Media','समाचार व मीडिया'],home:['Home','मुख्य पृष्ठ'],map:['Maps','नक्शा'],dir:['Find nearby','आस-पास खोजें'],civic:['Civic Desk','नागरिक सहायता'],news:['Notices','सूचनाएँ'],comm:['Community','समुदाय'],events:['Events','कार्यक्रम'],prop:['Rent & Property','मकान/दुकान'],info:['Official links','सरकारी संपर्क'],help:['Help','सहायता'],admin:['Admin','एडमिन'],all:['All','सभी'],add:['+ Add new','+ नया जोड़ें'],title:['Title','शीर्षक'],desc:['Description','विवरण'],cat:['Category','श्रेणी'],loc:['Locality','मोहल्ला'],photo:['Photo','फोटो'],submit:['Submit','जमा करें'],ph:['Search…','खोजें…'],hero:['Our mohalla, our information','मोहल्ला हमारा, जानकारी हमारी'],sub:['Services, official helplines, events and problems — Mahanagar and nearby, in Hindi and English.','सेवाएँ, सरकारी हेल्पलाइन, कार्यक्रम और समस्याएँ — महानगर और आस-पास, हिंदी व अंग्रेज़ी में।'],none:['Nothing here yet. Be the first to add.','अभी कुछ नहीं। पहले आप जोड़ें।'],help1:['Helpful','उपयोगी'],rep:['Report','रिपोर्ट'],open:['Open ↗','खोलें ↗'],off:['Official channels','आधिकारिक माध्यम']};
let LG=+localStorage.l||0,V='home',F={},Q='',LOCF='',AD=0;const t=k=>(TR[k]||[k,k])[LG];
const LOC=['Mahanagar','Ambahi Ka Purwa','Raheem Nagar','Vishnu Puri','P.W.D. Quarter','Begum Hazrat Mahal Nagar','Darshan Ganj','Akbar Nagar','Faizabad Road North','Dayal Fort','Gol Market'];
const CS=['Submitted','Under review','Verified','Forwarded to authority','In progress','Resolved','Rejected','Closed'];
const CATS={dir:['Hospitals','Pharmacies','Schools','Police stations','Parks','Markets','Electricians','Plumbers','Banks & ATMs'],news:['Official','Water','Electricity','Roads','Community'],comm:['Discussion','Lost & Found','Blood','Bhandara','Volunteer','Help'],events:['Blood camp','Health camp','Cultural','Religious','Meeting','Sports'],prop:['Flat','House','Room','PG','Shop','For sale'],info:['Helpline','Portal','Address']};
const IC={Hospitals:'🏥',Pharmacies:'💊',Schools:'🎓','Police stations':'🚓',Parks:'🌳',Markets:'🛒',Electricians:'💡',Plumbers:'🚰','Banks & ATMs':'🏧','Blood camp':'🩸',Blood:'🩸','Health camp':'⚕️',Cultural:'🎭',Religious:'🛕',Meeting:'🏛️',Sports:'⚽',Bhandara:'🍲',Official:'📢',Water:'💧',Electricity:'⚡',Roads:'🛣️',Community:'🤝',Discussion:'💬','Lost & Found':'🔎',Volunteer:'🙋',Help:'🆘',Flat:'🏢',House:'🏠',Room:'🛏️',PG:'🛌',Shop:'🏬','For sale':'🏷️',Helpline:'☎️',Portal:'🌐',Address:'📮'};
const GM=(q)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
let n=0;const s=(t,d,c,l,o={})=>({id:++n,t,d,c,l,st:'Awaiting verification',demo:0,h:0,...o});
const pub=(t,d,c,u,src)=>s(t,d,c,'Mahanagar',{st:'Community submitted',u,src});
const seed=()=>({dir:CATS.dir.map(c=>s(c+' near you','Live results on Google Maps, centred on your chosen locality (~2.5 km). Photos, hours and reviews come from Google.',c,'Mahanagar',{st:'Live on Google Maps',live:c})),
news:[s('SAMPLE: water supply notice','Invented example. Real notices should carry a source link.','Water','Mahanagar',{demo:1})],
comm:[s('SAMPLE: lost umbrella near Gol Market','Invented example of a lost & found post.','Lost & Found','Gol Market',{demo:1,st:'Community submitted'})],
events:[s('SAMPLE: blood donation camp','Invented example. Organiser, date and venue go here.','Blood camp','Mahanagar',{demo:1})],
prop:[s('SAMPLE: 2-room flat for rent','Invented example, no real price or contact.','Flat','Mahanagar',{demo:1})],
info:[pub('Lucknow Nagar Nigam (LMC) website','Municipal Corporation portal with the online complaint form and services.','Portal','https://lmc.up.nic.in','Public sources; confirm on site'),
pub('LMC complaint helpline 1533','Also listed publicly: 0522-2289782 / 0522-2289764.','Helpline','tel:1533','Public listings; confirm with LMC'),
pub('SafaiMitra sewer-cleaning WhatsApp','+91 63893 00137 for sewerage cleaning requests.','Helpline','https://wa.me/916389300137','Public listing; confirm with LMC'),
pub('Municipal Commissioner, PG Cell','Public Grievance Cell, Lucknow Nagar Nigam, Triliknath Road, Lalbagh, Lucknow 226001 — for escalation with your earlier reference number.','Address',GM('Lucknow Nagar Nigam Lalbagh'),'Public listing; confirm with LMC'),
pub('UP Jansunwai – Samadhan','State portal to complain against any department or official.','Portal','https://jansunwai.up.nic.in','services.india.gov.in; confirm link'),
pub('Jal Kal Vibhag control room','81770 54003 / 81770 54010 for water complaints (third-party listing).','Helpline','tel:8177054003','Third-party directory; verify'),
pub('Emergency 112','National emergency response number. Police, fire and ambulance.','Helpline','tel:112','Nationally published'),
pub('Google Local Guides','Add places, photos and corrections on Google Maps.','Portal','https://maps.google.com/localguides','Google')]});
let D;try{D=JSON.parse(localStorage.nbd2)}catch(e){}if(!D||!D.dir)D={...seed(),comp:[],audit:[]};else n=999;
const save=()=>localStorage.nbd2=JSON.stringify(D);const log=a=>{D.audit.unshift(new Date().toLocaleString()+' — '+a);save()};
const stc=x=>/verified|Live/.test(x)&&!/Awaiting/.test(x)?'ok':'w';
const dirU=it=>GM((it.live?it.live+' near ':it.t+' ')+(LOCF||it.l)+' Lucknow');
function card(it,m){const u=it.live?dirU(it):it.u;return `<div class="cd"><span class="b ${stc(it.st)}">${esc(tr(it.st))}</span>${it.demo?'<span class="b d">'+tr('SAMPLE')+'</span>':''}<h3>${IC[it.c]||'📍'} ${it.live?esc(tr(it.c))+X(' near you',' आस-पास'):esc(tr(it.t))}</h3><p>${esc(tr(it.d))}</p><small class="mu">${esc(tr(it.c))} · ${esc(tr(it.l))}${it.src?' · '+tr('Source')+': '+esc(tr(it.src)):''}</small>${it.img?`<img src="${it.img}" alt="" style="max-width:100%;margin-top:6px;border:2px solid var(--i)">`:''}<div class="row">${u?`<a href="${esc(u)}" target="_blank" rel="noopener"><button class="pri">${it.live?'🗺️ Google Maps':t('open')}</button></a>`:''}${it.live?'':`<button onclick="hp('${m}',${it.id})">👍 ${it.h}</button><button onclick="rp('${m}',${it.id})">⚑</button>`}</div></div>`}
function hp(m,i){D[m].find(x=>x.id==i).h++;save();go(V)}
function rp(m,i){const x=D[m].find(x=>x.id==i);x.st='Needs correction';log('Reported: '+x.t);alert(LG?'रिपोर्ट मिली।':'Report received for review.');go(V)}
function form(m){return `<details class="cd" style="margin:12px 0"><summary><b>${t('add')}</b></summary><label for="ft">${t('title')}</label><input id="ft"><label for="fd">${t('desc')}</label><textarea id="fd" rows="3"></textarea><label for="fc">${t('cat')}</label><select id="fc">${CATS[m].map(c=>`<option>${c}</option>`).join('')}</select><label for="fl">${t('loc')}</label><select id="fl">${LOC.map(c=>`<option>${c}</option>`).join('')}</select><label for="fu">Source link (optional)</label><input id="fu" placeholder="https://"><label for="fi">${t('photo')}</label><input id="fi" type="file" accept="image/*" onchange="pv(this)"><img id="pvw" alt="" style="max-width:150px;display:none;margin:6px 0"><br><button class="pri" onclick="addIt('${m}')">${t('submit')}</button><p class="mu">Saved in this browser only; enters the moderation queue as “Awaiting verification”.</p></details>`}
function pv(e){const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=$('#pvw');i.src=r.result;i.style.display='block'};r.readAsDataURL(f)}
function addIt(m){const ti=$('#ft').value.trim();if(!ti){alert(LG?'शीर्षक लिखें':'Please enter a title.');return}const it=s(ti,$('#fd').value,$('#fc').value,$('#fl').value,{mine:1});const u=$('#fu').value.trim();if(/^https?:\/\//.test(u)){it.u=u;it.src='Contributor link'}const im=$('#pvw');if(im.style.display=='block'&&im.src.length<400000)it.img=im.src;D[m].unshift(it);log('New '+m+': '+ti);go(V);alert(LG?'जमा हुआ। समीक्षा के बाद दिखेगा।':'Submitted. It will show after review.')}
function list(m,title){const f=F[m]||'';const items=D[m].filter(x=>x.st!='Rejected'&&(!f||x.c==f)&&(m=='dir'||!LOCF||x.l==LOCF)&&(!Q||(x.t+x.d).toLowerCase().includes(Q.toLowerCase())));
return `<h2>${title}</h2>${m=='dir'?`<div class="warn">Each tile opens live Google Maps results near your chosen locality in Lucknow. Change the locality in the top bar.</div>`:''}<div class="chips"><button class="${f?'':'on'}" onclick="F['${m}']='';go(V)">${t('all')}</button>${CATS[m].map(c=>`<button class="${f==c?'on':''}" onclick="F['${m}']='${c}';go(V)">${IC[c]} ${c}</button>`).join('')}</div>${m=='dir'?'':form(m)}<div class="grid">${items.map(x=>card(x,m)).join('')||`<p>${t('none')}</p>`}</div>`}
function civic(){return `<h2>${t('civic')}</h2><div class="warn"><b>Not an official complaint.</b> A report here is logged with Mohalla Buddy only; forwarding to authorities is not yet available. Use the official channels below to get it officially registered.</div><div class="grid">${D.info.filter(x=>x.u&&/Lucknow Nagar|1533|Jansunwai|SafaiMitra/.test(x.t)).map(x=>card(x,'info')).join('')}</div><h2>Log it here too</h2><div class="grid"><div class="cd"><label for="cc">${t('cat')}</label><select id="cc">${['Garbage','Open drain','Road damage / pothole','Water supply / leakage','Streetlight','Sewage','Stray animals','Public safety','Illegal dumping','Other'].map(c=>`<option>${c}</option>`).join('')}</select><label for="cd">${t('desc')}</label><textarea id="cd" rows="3"></textarea><label for="cl">${t('loc')}</label><select id="cl">${LOC.map(c=>`<option>${c}</option>`).join('')}</select><label for="ca">Landmark</label><input id="ca"><label for="fi">${t('photo')}</label><input id="fi" type="file" accept="image/*" onchange="pv(this)"><img id="pvw" alt="" style="max-width:150px;display:none"><label for="cv">Visibility</label><select id="cv"><option>Public</option><option>Private</option></select><br><button class="pri" onclick="addC()">${t('submit')}</button></div><div class="cd"><h3>Track a report</h3><label for="tr">Reference</label><input id="tr" placeholder="MB-DEMO-1001"><br><br><button class="pri" onclick="trk()">Track</button><div id="tres"></div></div></div><h2>Public log</h2><div class="grid">${D.comp.filter(c=>c.v=='Public').map(c=>`<div class="cd"><span class="b w">${c.s}</span><h3>${esc(c.c)}</h3><p>${esc(c.d)}</p><small>${esc(tr(c.l))} · ${c.r}</small></div>`).join('')||'<p>'+t('none')+'</p>'}</div>`}
function addC(){const d=$('#cd').value.trim();if(!d){alert(LG?'समस्या लिखें':'Please describe the issue.');return}const r='MB-DEMO-'+(1001+D.comp.length);D.comp.unshift({r,c:$('#cc').value,d,l:$('#cl').value,v:$('#cv').value,s:'Submitted',tl:[[new Date().toLocaleString(),'Logged with Mohalla Buddy','Awaiting verification. Not yet sent to any authority.']]});log('Report '+r);alert(X('Reference: ','संदर्भ संख्या: ')+r);go('civic')}
function trk(){const c=D.comp.find(x=>x.r==$('#tr').value.trim().toUpperCase());$('#tres').innerHTML=c?`<h4>${c.r} — <span class="b w">${c.s}</span></h4>${c.tl.map(e=>`<div class="tl"><b>${esc(e[1])}</b><br><small>${e[0]}</small><br>${esc(e[2])}</div>`).join('')}`:'<p>Not found.</p>'}
function home(){const g=m=>D[m].filter(x=>x.st!='Rejected');return `<div class="hero"><div><h1>${t('hero')}</h1><br><p>${t('sub')}</p></div><div class="door">Mahanagar<br><small style="font:500 .8rem Hind">Gol Market · Raheem Nagar · Darshan Ganj · Dayal Fort +7</small></div></div><h2>${t('off')}</h2><div class="grid">${D.info.filter(x=>/Lucknow Nagar|1533|Jansunwai|112/.test(x.t)).map(x=>card(x,'info')).join('')}</div><h2>${t('dir')}</h2><div class="grid g2">${CATS.dir.map(c=>`<a href="${GM(c+' near '+(LOCF||'Mahanagar')+' Lucknow')}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="cd arch"><i>${IC[c]}</i>${c}</div></a>`).join('')}</div><div class="row"><button class="pri" onclick="go('map')">🗺️ ${t('map')}</button><button onclick="go('civic')">${t('civic')}</button></div><h2>${t('news')}</h2><div class="grid">${g('news').slice(0,2).map(x=>card(x,'news')).join('')}</div><h2>${t('events')}</h2><div class="grid">${g('events').slice(0,2).map(x=>card(x,'events')).join('')}</div>`}
function comm(){const mine=['news','comm','events','prop'].flatMap(m=>D[m].filter(x=>x.mine));return `<div class="cd" style="margin-top:14px"><b>Your contributions:</b> ${mine.length} submitted · ${mine.filter(x=>/verified/.test(x.st)).length} approved · ${mine.filter(x=>x.st=='Awaiting verification').length} pending · ${mine.reduce((a,x)=>a+x.h,0)} helpful</div>`+list('comm',t('comm'))}
function help(){const q=[['How to use','Pick your locality at the top. “Find nearby” and “Maps” open live Google Maps results. Official links are under “Official links”.'],['Report a problem','Register it officially first (LMC portal, 1533 or Jansunwai), then log it here to keep your own record.'],['Add information','Use “+ Add new” in Notices, Events, Community or Rent. Add a source link where you can.'],['Verification','Statuses: Officially verified, Locally verified, Community submitted, Awaiting verification, Needs correction, Rejected, Closed, Outdated.'],['Privacy','No phone numbers or addresses are shown publicly. In this prototype data stays in your browser.'],['Disclaimer','Independent community project. Not official, not political.']];return `<h2>${t('help')}</h2>${q.map(x=>`<details class="cd" style="margin:10px 0"><summary><b>${x[0]}</b></summary><p>${x[1]}</p></details>`).join('')}`}
function admin(){if(!AD)return `<h2>Admin</h2><div class="warn">Demo access only, not real security. Passcode: <b>admin</b></div><label for="pw">Passcode</label><input id="pw" type="password" style="max-width:240px"><br><br><button class="pri" onclick="if($('#pw').value=='admin'){AD=1;go('admin')}else alert('Wrong passcode')">Enter</button>`;
const M=['news','comm','events','prop','info'],pend=M.flatMap(m=>D[m].filter(x=>x.st=='Awaiting verification'||x.st=='Needs correction').map(x=>[m,x]));
return `<h2>Admin</h2><div class="grid g2">${M.map(m=>`<div class="cd"><b>${D[m].length}</b><br>${t(m)}</div>`).join('')}<div class="cd"><b>${pend.length}</b><br>Pending</div><div class="cd"><b>${D.comp.length}</b><br>Reports</div></div><h2>Queue</h2><div class="grid">${pend.map(([m,x])=>`<div class="cd"><b>${esc(x.t)}</b><p>${m} · ${esc(x.st)}</p><div class="row"><button onclick="ad('${m}',${x.id},'Locally verified')">✔</button><button onclick="ad('${m}',${x.id},'Rejected')">✖</button><button onclick="ad('${m}',${x.id},'Outdated')">⏳</button><button onclick="ed('${m}',${x.id})">✎</button><button onclick="ad('${m}',${x.id},'DEL')">🗑</button></div></div>`).join('')||'<p>Queue is empty.</p>'}</div><h2>Reports</h2>${D.comp.map(c=>`<div class="cd" style="margin:8px 0"><b>${c.r}</b> · ${esc(c.c)} · ${esc(c.l)}<br><select id="s${c.r}">${CS.map(x=>`<option ${x==c.s?'selected':''}>${x}</option>`).join('')}</select><input id="n${c.r}" placeholder="Progress note" style="margin-top:6px"><br><button class="pri" style="margin-top:6px" onclick="cu('${c.r}')">Update</button></div>`).join('')||'<p>None yet.</p>'}<h2>Audit trail</h2><div class="cd">${D.audit.map(a=>`<div>${esc(a)}</div>`).join('')||'No actions yet.'}</div><div class="row"><button onclick="AD=0;go('admin')">Log out</button><button onclick="if(confirm('Reset all data?')){localStorage.removeItem('nbd2');location.reload()}">Reset data</button></div>`}
function ad(m,i,st){const x=D[m].find(y=>y.id==i);if(st=='DEL')D[m]=D[m].filter(y=>y.id!=i);else x.st=st;log(st+': '+x.t);go('admin')}
function ed(m,i){const x=D[m].find(y=>y.id==i),v=prompt('Edit title',x.t);if(v){x.t=v;log('Edited: '+v);go('admin')}}
function cu(r){const c=D.comp.find(x=>x.r==r);c.s=$('#s'+r).value;c.tl.push([new Date().toLocaleString(),c.s,$('#n'+r).value||'Status updated']);log(r+' → '+c.s);go('admin')}
function search(){const k=Q.toLowerCase();const res=['dir','news','comm','events','prop','info'].flatMap(m=>D[m].filter(x=>(x.t+x.d+x.c+x.l).toLowerCase().includes(k)).map(x=>[m,x]));return `<h2>“${esc(Q)}”</h2><div class="grid">${res.map(([m,x])=>card(x,m)).join('')||`<p>${t('none')}</p>`}</div>`}

const CM={hospital:['🏥','Hospitals','अस्पताल','#E8A0A0',1],clinic:['⚕️','Clinics & doctors','क्लिनिक / डॉक्टर','#F2C0C0',1],pharmacy:['💊','Pharmacies','दवा की दुकानें','#BFE3C8',1],police:['🚓','Police stations','पुलिस थाने','#9DB8E8',1],fire:['🚒','Fire stations','दमकल','#F4B183',1],post:['📮','Post offices','डाकघर','#F2D480',1],watertank:['🚰','Water tanks & works','पानी की टंकी / जलकल','#9ED6F0',1],power:['⚡','Electricity substations','बिजली सब-स्टेशन','#F7E26B',1],waste:['🗑️','Garbage & waste points','कूड़ा निस्तारण','#C9B79C',1],toilets:['🚻','Public toilets','सार्वजनिक शौचालय','#D6C2E8',1],water:['💧','Drinking water','पीने का पानी','#B5E3F5',1],park:['🌳','Parks','पार्क','#A8D5A0',1],market:['🛒','Markets','बाज़ार','#F2B88A',1],edu:['🎓','Schools & colleges','स्कूल / कॉलेज','#C8D3F0',0],bank:['🏧','Banks & ATMs','बैंक / ATM','#D9D9D9',0],bus:['🚌','Bus stops','बस स्टॉप','#E8E1A0',0]};

function cls(g){if(g.man_made&&/^(water_tower|storage_tank|water_works)$/.test(g.man_made)){if(g.man_made=='storage_tank'&&g.content&&g.content!='water')return;return 'watertank'}
if(g.power=='substation')return 'power';if(g.leisure=='park')return 'park';if(g.highway=='bus_stop')return 'bus';
return {hospital:'hospital',clinic:'clinic',doctors:'clinic',pharmacy:'pharmacy',police:'police',fire_station:'fire',post_office:'post',waste_disposal:'waste',waste_transfer_station:'waste',recycling:'waste',toilets:'toilets',drinking_water:'water',marketplace:'market',school:'edu',college:'edu',bank:'bank',atm:'bank'}[g.amenity]}
function pop(p){const c=CM[p.k],g=p.tags,nm=g.name||g['name:hi']||g['name:en']||c[1+LG]+X(' (unnamed)',' (बिना नाम)'),ad=[g['addr:housenumber'],g['addr:street'],g['addr:suburb']||g['addr:city']].filter(Boolean).join(', ');
return `<div class="pp"><span class="b">OpenStreetMap · ${X('unverified','असत्यापित')}</span><h3>${c[0]} ${esc(nm)}</h3><div>${esc(c[1+LG])}</div>${ad?`<div>📍 ${esc(ad)}</div>`:''}${g.phone||g['contact:phone']?`<div>☎ ${esc(g.phone||g['contact:phone'])}</div>`:''}${g.opening_hours?`<div>🕒 ${esc(g.opening_hours)}</div>`:''}<div><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}">🧭 ${X('Directions','रास्ता')}</a> · <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/${p.type}/${p.id}">${X('Details','विवरण')}</a> · <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/edit?${p.type}=${p.id}">✎ ${X('Correct','सुधारें')}</a></div></div>`}
function draw(){Object.values(LY).forEach(l=>l.clearLayers());const cnt={};P.forEach(p=>{cnt[p.k]=(cnt[p.k]||0)+1;const c=CM[p.k];L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${c[3]}"><span>${c[0]}</span></div>`,iconSize:[30,30],iconAnchor:[15,40],popupAnchor:[0,-36]}),title:p.tags.name||c[1+LG]}).bindPopup(pop(p)).addTo(LY[p.k])});
Object.keys(CM).forEach(k=>{ON[k]?MP.addLayer(LY[k]):MP.removeLayer(LY[k])});
$('#cc2').innerHTML=Object.keys(CM).map(k=>`<button data-k="${k}" class="${ON[k]?'on':''}">${CM[k][0]} ${CM[k][1+LG]} (${cnt[k]||0})</button>`).join('');
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ON[b.dataset.k]=!ON[b.dataset.k];draw()})}
async function ld(){const st=$('#st2');if(MP.getZoom()<13){st.textContent=X('Zoom in a little, then reload.','थोड़ा ज़ूम करें, फिर लोड करें।');return}st.textContent=X('Loading places…','स्थान लोड हो रहे हैं…');const b=MP.getBounds(),bb=`${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
const q=`[out:json][timeout:40];(nwr["amenity"~"^(hospital|clinic|doctors|pharmacy|police|fire_station|post_office|school|college|waste_disposal|waste_transfer_station|recycling|toilets|drinking_water|marketplace|bank|atm)$"](${bb});nwr["man_made"~"^(water_tower|storage_tank|water_works)$"](${bb});nwr["power"="substation"](${bb});nwr["leisure"="park"](${bb});nwr["highway"="bus_stop"](${bb}););out center tags 1500;`;
for(const u of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q)});if(!r.ok)continue;const j=await r.json();P=j.elements.map(e=>({type:e.type,id:e.id,lat:e.lat??(e.center&&e.center.lat),lon:e.lon??(e.center&&e.center.lon),tags:e.tags||{},k:cls(e.tags||{})})).filter(p=>p.k&&p.lat);if(!$('#cc2'))return;draw();st.textContent=P.length+' '+X('places loaded','स्थान लोड हुए');return}catch(e){}}
st.textContent=X('Could not load places. Check internet and try again.','स्थान लोड नहीं हुए। इंटरनेट जाँचकर दोबारा प्रयास करें।')}
async function geo(l){$('#st2').textContent='…';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(l+', Lucknow'));const j=await r.json();if(j[0]){MP.setView([+j[0].lat,+j[0].lon],16);ld()}else $('#st2').textContent=X('This locality was not found on the map; zoom in manually.','यह मोहल्ला नक्शे पर नहीं मिला; ख़ुद ज़ूम करके देखें।')}catch(e){$('#st2').textContent=X('Could not load. Check internet.','लोड नहीं हुआ। इंटरनेट जाँचें।')}}
function lguide(){return `<h2>${X('Be a Local Guide','लोकल गाइड बनें')}</h2><div class="grid"><div class="cd"><h3>${X('Add or fix a place','स्थान जोड़ें या सुधारें')}</h3><p>${X('On OpenStreetMap or Google Maps, add a missing place, correct hours, or upload photos. Your edits help everyone, not only this site.','OpenStreetMap या Google Maps पर छूटा हुआ स्थान जोड़ें, समय सुधारें या फ़ोटो डालें। आपका योगदान सबके काम आता है, सिर्फ़ इस साइट के नहीं।')}</p><div class="row"><a href="https://maps.google.com/localguides" target="_blank" rel="noopener"><button class="pri">Google Local Guides ↗</button></a><a href="https://www.openstreetmap.org/" target="_blank" rel="noopener"><button>OpenStreetMap ↗</button></a></div></div></div>`}
function mapx(){return `<h2>${X('Street map','गली का नक्शा')}</h2><div class="warn">${X('Free street-level map from OpenStreetMap. Places come from OpenStreetMap volunteers: they are unverified and may be missing or outdated, and anyone can fix them on OpenStreetMap. The dashed circle is the approximate 2.5 km discovery area. Official ward boundary: not yet verified.','OpenStreetMap का मुफ़्त गली-स्तर नक्शा। स्थान OpenStreetMap के स्वयंसेवकों से आते हैं: ये असत्यापित हैं, अधूरे या पुराने हो सकते हैं, और कोई भी इन्हें OpenStreetMap पर सुधार सकता है। बिंदीदार घेरा लगभग 2.5 किमी का खोज क्षेत्र है। आधिकारिक वार्ड सीमा: अभी सत्यापित नहीं।')}</div><div class="chips">${LOC.map(l=>`<button data-l="${l}">📍 ${tr(l)}</button>`).join('')}</div><div class="chips" id="cc2"></div><div id="lm" style="height:68vh;min-height:360px;border:2px solid var(--i);box-shadow:5px 5px 0 var(--t)"></div><p id="st2" class="mu"></p><div class="row"><button class="pri" id="rl">${X('🔄 Load places in this view','🔄 इस क्षेत्र के स्थान लोड करें')}</button><button id="gl">${X('📍 My location','📍 मेरी जगह')}</button><a id="an" target="_blank" rel="noopener" href="#"><button>${X('➕ Add a missing place','➕ छूटा हुआ स्थान जोड़ें')}</button></a></div>`+lguide()}
function initMap(){if(!window.L){$('#lm').innerHTML='<p style="padding:16px">Map library could not load. Check your internet.</p>';return}if(MP){try{MP.remove()}catch(e){}}
MP=L.map('lm').setView(MC,14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(MP);
L.circle(MC,{radius:2500,color:'#A8412D',weight:2,dashArray:'8 6',fill:false}).addTo(MP).bindTooltip(X('≈ 2.5 km discovery area (approximate)','लगभग 2.5 किमी खोज क्षेत्र (अनुमानित)'));
LY={};Object.keys(CM).forEach(k=>LY[k]=L.layerGroup().addTo(MP));

draw();if(!P.length)ld()}

:22px">${x[0]}</div></a>`).join('')}</div>`}
